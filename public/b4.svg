<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="32"/>
  
  <!-- Book base -->
  <rect x="100" y="120" width="200" height="160" rx="16" fill="#115e59" stroke="#2dd4bf" stroke-width="4"/>
  <rect x="110" y="130" width="180" height="140" rx="8" fill="#134e4a"/>
  
  <!-- Book pages effect -->
  <rect x="120" y="140" width="160" height="120" rx="4" fill="#f0fdfa" opacity="0.9"/>
  
  <!-- Book lines -->
  <line x1="140" y1="170" x2="260" y2="170" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="195" x2="240" y2="195" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="220" x2="260" y2="220" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="245" x2="220" y2="245" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Checkmark badge -->
  <circle cx="280" cy="100" r="40" fill="#2dd4bf" stroke="#115e59" stroke-width="4"/>
  <path d="M260 100 L275 115 L305 85" stroke="#042f2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Bookmark ribbon -->
  <path d="M180 120 L180 80 L200 100 L220 80 L220 120" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Graduation cap accent -->
  <g transform="translate(80, 260)">
    <rect x="0" y="20" width="60" height="4" rx="2" fill="#5eead4"/>
    <rect x="10" y="0" width="40" height="24" rx="4" fill="#2dd4bf"/>
    <circle cx="30" cy="12" r="6" fill="#042f2e"/>
    <line x1="30" y1="18" x2="30" y2="50" stroke="#5eead4" stroke-width="2"/>
    <circle cx="30" cy="54" r="5" fill="#fbbf24"/>
  </g>
  
  <!-- CBE text hint -->
  <text x="200" y="340" text-anchor="middle" fill="#0d9488" font-family="Georgia, serif" font-size="18" font-weight="bold" opacity="0.7">CBE Curriculum</text>
  <text x="200" y="365" text-anchor="middle" fill="#0d9488" font-family="Georgia, serif" font-size="14" opacity="0.5">Competency-Based Education</text>
</svg>
