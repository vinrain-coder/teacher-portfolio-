<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c68642;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b87333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hair2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg2)" rx="24"/>
  <!-- Shoulders / Clothing -->
  <path d="M80 500 L80 380 Q200 340 320 380 L320 500 Z" fill="#1e3a5f"/>
  <path d="M120 500 L120 400 Q200 370 280 400 L280 500 Z" fill="#3b82f6"/>
  <!-- Collar -->
  <path d="M160 400 L200 430 L240 400" stroke="#fff" stroke-width="4" fill="none"/>
  <!-- Neck -->
  <rect x="175" y="290" width="50" height="60" fill="url(#skin2)" rx="8"/>
  <!-- Face -->
  <ellipse cx="200" cy="220" rx="85" ry="100" fill="url(#skin2)"/>
  <!-- Hair -->
  <path d="M115 220 Q115 100 200 100 Q285 100 285 220 Q285 170 260 150 Q240 130 200 130 Q160 130 140 150 Q115 170 115 220" fill="url(#hair2)"/>
  <path d="M120 210 Q130 150 200 150 Q270 150 280 210" fill="url(#hair2)"/>
  <!-- Eyes -->
  <ellipse cx="165" cy="210" rx="12" ry="8" fill="#fff"/>
  <ellipse cx="235" cy="210" rx="12" ry="8" fill="#fff"/>
  <circle cx="165" cy="210" r="5" fill="#1a1a1a"/>
  <circle cx="235" cy="210" r="5" fill="#1a1a1a"/>
  <!-- Eyebrows -->
  <path d="M150 195 Q165 188 180 195" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M220 195 Q235 188 250 195" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M200 220 L195 250 Q200 255 205 250 L200 220" fill="#a06b3a" opacity="0.4"/>
  <!-- Smile -->
  <path d="M170 270 Q200 290 230 270" stroke="#8b5a2b" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
