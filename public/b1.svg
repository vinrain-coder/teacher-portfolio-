<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Classroom board -->
  <rect x="150" y="80" width="500" height="280" rx="12" fill="url(#boardGrad)" stroke="#2dd4bf" stroke-width="3" opacity="0.9"/>
  
  <!-- Board content - equations -->
  <text x="400" y="150" text-anchor="middle" fill="#5eead4" font-family="Georgia, serif" font-size="28" font-weight="bold">E = mc²</text>
  <text x="400" y="200" text-anchor="middle" fill="#5eead4" font-family="Georgia, serif" font-size="22">Photosynthesis</text>
  <line x1="250" y1="220" x2="550" y2="220" stroke="#2dd4bf" stroke-width="2" opacity="0.5"/>
  <text x="400" y="260" text-anchor="middle" fill="#99f6e4" font-family="Georgia, serif" font-size="18">Explore · Discover · Learn</text>
  <text x="400" y="310" text-anchor="middle" fill="#ccfbf1" font-family="Georgia, serif" font-size="16">CBE Curriculum 2024</text>
  
  <!-- Teacher figure -->
  <circle cx="400" cy="420" r="28" fill="#0d9488"/>
  <path d="M380 440 Q400 460 420 440 L415 520 Q400 530 385 520 Z" fill="#115e59"/>
  <circle cx="400" cy="410" r="8" fill="#5eead4"/>
  
  <!-- Students row 1 -->
  <g opacity="0.85">
    <circle cx="180" cy="500" r="18" fill="#0f766e"/>
    <rect x="165" y="520" width="30" height="35" rx="4" fill="#134e4a"/>
    <circle cx="280" cy="500" r="18" fill="#0f766e"/>
    <rect x="265" y="520" width="30" height="35" rx="4" fill="#134e4a"/>
    <circle cx="520" cy="500" r="18" fill="#0f766e"/>
    <rect x="505" y="520" width="30" height="35" rx="4" fill="#134e4a"/>
    <circle cx="620" cy="500" r="18" fill="#0f766e"/>
    <rect x="605" y="520" width="30" height="35" rx="4" fill="#134e4a"/>
  </g>
  
  <!-- Books on desks -->
  <rect x="155" y="535" width="50" height="8" rx="2" fill="#2dd4bf" opacity="0.7"/>
  <rect x="155" y="547" width="50" height="8" rx="2" fill="#5eead4" opacity="0.7"/>
  <rect x="255" y="535" width="50" height="8" rx="2" fill="#2dd4bf" opacity="0.7"/>
  <rect x="255" y="547" width="50" height="8" rx="2" fill="#5eead4" opacity="0.7"/>
  <rect x="495" y="535" width="50" height="8" rx="2" fill="#2dd4bf" opacity="0.7"/>
  <rect x="495" y="547" width="50" height="8" rx="2" fill="#5eead4" opacity="0.7"/>
  <rect x="595" y="535" width="50" height="8" rx="2" fill="#2dd4bf" opacity="0.7"/>
  <rect x="595" y="547" width="50" height="8" rx="2" fill="#5eead4" opacity="0.7"/>
  
  <!-- Light bulb ideas -->
  <g transform="translate(680, 120)">
    <path d="M20 0 C9 0 0 9 0 20 C0 30 8 38 18 40 L18 55 C18 60 22 60 22 60 C22 60 26 60 26 55 L26 40 C36 38 44 30 44 20 C44 9 35 0 24 0 Z" fill="#fbbf24" opacity="0.9"/>
    <rect x="18" y="60" width="8" height="6" rx="2" fill="#f59e0b"/>
    <rect x="16" y="68" width="12" height="4" rx="2" fill="#d97706"/>
  </g>
  <g transform="translate(100, 180)">
    <path d="M15 0 C7 0 0 7 0 15 C0 23 6 28 14 30 L14 42 C14 46 18 46 18 46 C18 46 22 46 22 42 L22 30 C30 28 36 23 36 15 C36 7 29 0 21 0 Z" fill="#fbbf24" opacity="0.7"/>
    <rect x="14" y="46" width="6" height="5" rx="2" fill="#f59e0b"/>
    <rect x="12" y="53" width="10" height="3" rx="1" fill="#d97706"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="720" cy="520" r="40" fill="#2dd4bf" opacity="0.1"/>
  <circle cx="80" cy="550" r="30" fill="#0d9488" opacity="0.08"/>
  
  <!-- Bottom text hint -->
  <text x="400" y="580" text-anchor="middle" fill="#0d9488" font-family="Georgia, serif" font-size="14" font-weight="bold" opacity="0.6">Student-Centered Learning</text>
