<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c49a6c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hair1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3e2723;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4e342e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg1)" rx="24"/>
  <!-- Shoulders / Clothing -->
  <path d="M80 500 L80 380 Q200 340 320 380 L320 500 Z" fill="#1e3a5f"/>
  <path d="M120 500 L120 400 Q200 370 280 400 L280 500 Z" fill="#2563eb"/>
  <!-- Neck -->
  <rect x="175" y="290" width="50" height="60" fill="url(#skin1)" rx="8"/>
  <!-- Face -->
  <ellipse cx="200" cy="220" rx="85" ry="100" fill="url(#skin1)"/>
  <!-- Hair -->
  <path d="M115 220 Q115 100 200 100 Q285 100 285 220 Q285 180 260 160 Q240 140 200 140 Q160 140 140 160 Q115 180 115 220" fill="url(#hair1)"/>
  <path d="M120 210 Q130 150 200 150 Q270 150 280 210" fill="url(#hair1)"/>
  <!-- Eyes -->
  <ellipse cx="165" cy="210" rx="12" ry="8" fill="#fff"/>
  <ellipse cx="235" cy="210" rx="12" ry="8" fill="#fff"/>
  <circle cx="165" cy="210" r="5" fill="#3e2723"/>
  <circle cx="235" cy="210" r="5" fill="#3e2723"/>
  <!-- Eyebrows -->
  <path d="M150 195 Q165 188 180 195" stroke="#3e2723" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M220 195 Q235 188 250 195" stroke="#3e2723" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M200 220 L195 250 Q200 255 205 250 L200 220" fill="#b8956e" opacity="0.4"/>
  <!-- Smile -->
  <path d="M170 270 Q200 290 230 270" stroke="#a67c52" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Earrings -->
  <circle cx="115" cy="240" r="6" fill="#fbbf24"/>
  <circle cx="285" cy="240" r="6" fill="#fbbf24"/>
</svg>
