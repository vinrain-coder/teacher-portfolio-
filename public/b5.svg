<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="32"/>
  
  <!-- Flask / Science -->
  <g transform="translate(60, 80)">
    <!-- Flask body -->
    <path d="M50 0 L50 80 Q50 100 80 110 Q110 120 110 150 L110 200 Q110 210 100 210 L60 210 Q50 210 50 200 L50 150 Q50 120 80 110 Q110 100 110 80 L110 0" fill="#2dd4bf" stroke="#115e59" stroke-width="3" opacity="0.85"/>
    <!-- Flask liquid -->
    <path d="M55 90 Q55 110 80 118 Q105 126 105 150 L105 200 Q105 205 100 205 L60 205 Q55 205 55 200 L55 150 Q55 118 80 110 Q105 102 105 80" fill="#0d9488" opacity="0.6"/>
    <!-- Bubbles -->
    <circle cx="75" cy="140" r="4" fill="#5eead4" opacity="0.8"/>
    <circle cx="85" cy="160" r="3" fill="#5eead4" opacity="0.7"/>
    <circle cx="70" cy="170" r="2" fill="#5eead4" opacity="0.6"/>
    <!-- Flask neck -->
    <rect x="62" y="0" width="36" height="30" rx="4" fill="#115e59" stroke="#2dd4bf" stroke-width="2"/>
  </g>
  
  <!-- Plant / Agriculture -->
  <g transform="translate(220, 60)">
    <!-- Pot -->
    <path d="M40 180 L60 180 L55 240 Q55 250 45 250 Q35 250 35 240 L30 180 Z" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <rect x="25" y="170" width="60" height="14" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <!-- Soil -->
    <ellipse cx="55" cy="178" rx="26" ry="6" fill="#78350f" opacity="0.8"/>
    
    <!-- Stem -->
    <path d="M55 170 Q55 140 55 100 Q55 80 65 70" stroke="#166534" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M55 140 Q30 120 20 100" stroke="#166534" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M55 110 Q80 90 90 70" stroke="#166534" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <ellipse cx="20" cy="95" rx="18" ry="8" fill="#22c55e" stroke="#15803d" stroke-width="2" transform="rotate(-30 20 95)"/>
    <ellipse cx="90" cy="65" rx="18" ry="8" fill="#22c55e" stroke="#15803d" stroke-width="2" transform="rotate(30 90 65)"/>
    <ellipse cx="65" cy="65" rx="18" ry="8" fill="#16a34a" stroke="#15803d" stroke-width="2" transform="rotate(0 65 65)"/>
    
    <!-- Flower/Fruit -->
    <circle cx="65" cy="55" r="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="65" cy="55" r="4" fill="#f59e0b"/>
    
    <!-- Roots hint -->
    <path d="M45 240 Q35 255 25 265" stroke="#92400e" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M55 240 Q55 255 55 268" stroke="#92400e" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M55 240 Q65 255 75 265" stroke="#92400e" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Science symbols -->
  <g transform="translate(140, 280)">
    <text x="60" y="40" text-anchor="middle" fill="#2dd4bf" font-family="Georgia, serif" font-size="32" font-weight="bold" opacity="0.9">Be</text>
    <text x="60" y="70" text-anchor="middle" fill="#0d9488" font-family="Georgia, serif" font-size="16" opacity="0.7">Biology</text>
  </g>
  
  <!-- Agriculture symbols -->
  <g transform="translate(280, 280)">
    <text x="60" y="40" text-anchor="middle" fill="#22c55e" font-family="Georgia, serif" font-size="32" font-weight="bold" opacity="0.9">Ag</text>
    <text x="60" y="70" text-anchor="middle" fill="#166534" font-family="Georgia, serif" font-size="16" opacity="0.7">Agriculture</text>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="380" r="30" fill="#2dd4bf" opacity="0.08"/>
  <circle cx="350" cy="30" r="25" fill="#22c55e" opacity="0.08"/>
  
  <!-- Bottom label -->
  <text x="200" y="390" text-anchor="middle" fill="#0d9488" font-family="Georgia, serif" font-size="14" font-weight="bold" opacity="0.6">Science &amp; Agriculture Education</text>
</svg>
